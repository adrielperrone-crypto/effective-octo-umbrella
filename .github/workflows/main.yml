name: RDP

on:
  workflow_dispatch:
    inputs:
      extra_disks:
        description: "Discos virtuais extras"
        required: false
        default: "4"
        type: choice
        options: ["2", "4", "6", "8"]
      disk_size_gb:
        description: "Tamanho de cada disco (GB)"
        required: false
        default: "50"
      gpu_virtual:
        description: "Instalar GPU virtual (Parsec VDD)"
        required: false
        default: true
        type: boolean

jobs:
  secure-rdp:
    name: RDP Session
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Informacao do sistema
        run: |
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $mem = Get-CimInstance Win32_ComputerSystem
          $os  = Get-CimInstance Win32_OperatingSystem
          Write-Host "OS: $($os.Caption) $($os.Version)"
          Write-Host "CPU: $($cpu.Name) | Cores: $($cpu.NumberOfCores) | Threads: $($cpu.NumberOfLogicalProcessors)"
          Write-Host "RAM: $([math]::Round($mem.TotalPhysicalMemory/1GB,2)) GB"
          Get-Disk | Format-Table Number, FriendlyName, @{N='Size (GB)';E={[math]::Round($_.Size/1GB,1)}}, PartitionStyle -AutoSize

      - name: Criar discos virtuais
        continue-on-error: true
        run: |
          $diskCount  = [int]"${{ inputs.extra_disks }}"
          $diskSizeGB = [int]"${{ inputs.disk_size_gb }}"
          $vhdDir = "C:\VirtualDisks"
          New-Item -ItemType Directory -Path $vhdDir -Force | Out-Null

          for ($i = 1; $i -le $diskCount; $i++) {
              $vhdPath = "$vhdDir\VirtualDisk$i.vhd"
              $dp = "$env:TEMP\dp$i.txt"
              @(
                "create vdisk file=`"$vhdPath`" maximum=$($diskSizeGB * 1024) type=expandable",
                "select vdisk file=`"$vhdPath`"",
                "attach vdisk",
                "create partition primary",
                "format fs=ntfs quick label=VDisk$i",
                "assign"
              ) | Set-Content -Path $dp -Encoding ASCII
              diskpart /s $dp
              Write-Host "Disco $i criado"
          }

          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemLabel, @{N='Size (GB)';E={[math]::Round($_.Size/1GB,1)}}, @{N='Free (GB)';E={[math]::Round($_.SizeRemaining/1GB,1)}} -AutoSize

      - name: GPU virtual (Parsec VDD)
        if: ${{ inputs.gpu_virtual }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          $vddUrl  = "https://github.com/nomi-san/parsec-vdd/releases/download/v0.45.0/parsec-vdd-0.45.0.exe"
          $vddPath = "$env:TEMP\parsec-vdd.exe"
          Invoke-WebRequest -Uri $vddUrl -OutFile $vddPath -UseBasicParsing
          Start-Process -FilePath $vddPath -ArgumentList "/install", "/quiet" -Wait
          Remove-Item $vddPath -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 8
          Get-CimInstance Win32_VideoController | Select-Object Name, AdapterRAM | Format-Table -AutoSize

      - name: Configurar RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 2 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10 | Out-Null

          Restart-Service -Name TermService -Force
          Start-Sleep -Seconds 3
          if ((Get-Service -Name TermService).Status -ne 'Running') {
              Write-Error "RDP service failed to start"
              exit 1
          }

      - name: Criar usuario ADR
        run: |
          $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
          $lower = "abcdefghijkmnpqrstuvwxyz".ToCharArray()
          $nums  = "23456789".ToCharArray()
          $parts = @()
          $parts += $upper | Get-Random -Count 5
          $parts += $lower | Get-Random -Count 6
          $parts += $nums  | Get-Random -Count 5
          $password = -join ($parts | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          if (Get-LocalUser -Name "ADR" -ErrorAction SilentlyContinue) { Remove-LocalUser -Name "ADR" }
          New-LocalUser -Name "ADR" -Password $securePass -FullName "ADR" -AccountNeverExpires -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group "Administrators" -Member "ADR"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "ADR"

          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name "ADR" -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }

      - name: Instalar Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath -UseBasicParsing
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait -PassThru
          Remove-Item $installerPath -Force
          if ($proc.ExitCode -ne 0) {
              Write-Error "Tailscale install failed (exit code: $($proc.ExitCode))"
              exit 1
          }

      - name: Conectar Tailscale
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"
          $hostname  = "gh-rdp-$env:GITHUB_RUN_ID"

          & $tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname=$hostname --accept-routes

          $tsIP = $null
          $tries = 0
          while (-not $tsIP -and $tries -lt 15) {
              $tries++
              $tsIP = (& $tailscale ip -4 2>$null | Select-Object -First 1)
              if (-not $tsIP) { Start-Sleep -Seconds 4 }
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verificar conectividade RDP
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue
          if ($test.TcpTestSucceeded) {
              Write-Host "Porta 3389 acessivel."
          } else {
              Write-Warning "Teste da porta 3389 falhou."
          }

      - name: Sessao RDP ativa
        run: |
          Write-Host ""
          Write-Host "=========== SESSAO RDP PRONTA ==========="
          Write-Host "Endereco : $env:TAILSCALE_IP"
          Write-Host "Usuario  : ADR"
          Write-Host "Senha    : $env:RDP_PASSWORD"
          Write-Host "Porta    : 3389"
          Write-Host "=========================================="
          Write-Host ""
          Get-Volume | Where-Object DriveLetter | Format-Table DriveLetter, FileSystemLabel, @{N='Size (GB)';E={[math]::Round($_.Size/1GB,1)}}, @{N='Free (GB)';E={[math]::Round($_.SizeRemaining/1GB,1)}} -AutoSize

          while ($true) {
              Write-Host "[$(Get-Date)] RDP ativo"
              Start-Sleep -Seconds 300
          }
